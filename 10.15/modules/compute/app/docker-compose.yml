services:
  fastapi:
    build: .
    image: std17-fastapi-xray:latest
    container_name: fastapi-xray-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    # restart 정책은 두지 않음 → 재시작은 systemd(fastapi.service)가 담당
    networks:
      - xray-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

newtorks:
  xray-net:
    driver: bridge